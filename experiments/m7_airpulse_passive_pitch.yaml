# M7 example: AirPulse fixed-body hover with PASSIVE torsional wing pitch.
# The prescribed pitch profile is ignored for the sprung wings; pitch evolves
# under aero moment + torsional spring-damper (dynamics/wing_pitch_compliance).
# Compare against m4_airpulse_hover_fixed.yaml (prescribed 45 deg sinusoid).
name: m7_airpulse_passive_pitch
kind: fixed_body
vehicle: ../reference_vehicles/airpulse_passive_pitch.yaml
passive_pitch: true

kinematics:
  flap_amplitude: {value: 1.2217, unit: rad, provenance: {source: literature, reference: "arXiv:2602.06811 (±70 deg stroke)"}}
  flap_frequency: {value: 3.25, unit: Hz, provenance: {source: literature, reference: "arXiv:2602.06811"}}
  pitch_amplitude: {value: 0.0, unit: rad, provenance: {source: estimated, uncertainty_or_range: "ignored when passive_pitch is enabled"}}
  pitch_phase: {value: 3.14159, unit: rad, provenance: {source: estimated, uncertainty_or_range: "ignored when passive_pitch is enabled"}}
  pitch_offset: {value: 0.0, unit: rad, provenance: {source: estimated, uncertainty_or_range: "ignored when passive_pitch is enabled"}}
  stroke_plane_angle: {value: 0.0, unit: rad, provenance: {source: estimated, uncertainty_or_range: "body-axis stroke plane; dihedral carried per wing"}}

environment:
  air_density: {value: 1.225, unit: kg/m^3, provenance: {source: literature, reference: "arXiv:2602.06811 methods"}}
  kinematic_viscosity: {value: 1.460e-5, unit: m^2/s, provenance: {source: literature, reference: "arXiv:2602.06811 methods"}}
  wind: {value: [0.0, 0.0, 0.0], unit: m/s, provenance: {source: estimated, uncertainty_or_range: "still air"}}

n_wingbeats: 4
steps_per_wingbeat: 40
