[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fwmav-sim"
version = "0.0.0"
description = "Flapping-wing micro aerial vehicle (FWMAV) flight-dynamics and control workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "meshcat>=0.3",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4",
    "sympy>=1.12",
]
# M5 (DR-002): desktop workbench shell — installed here, import-guarded in ui/
gui = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",  # M9 T5: Qt-native GL scene (viz/gl_scene.py)
]

[project.scripts]
fwmav-sim = "fwmav_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fwmav_sim"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# generated by derivations/reduced_longitudinal.py; do not hand-edit or reformat
"src/fwmav_sim/dynamics/_reduced_reference.py" = ["E501", "E741"]
# derivations/probes/*.py are derivation-time verification evidence (referenced by
# dynamics/spatial.py docstrings and the M3 report), not production code
"derivations/probes/*.py" = ["E402", "E701", "E702", "E501", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: long-running tests (free-body runs)"]
