# M6 demo vehicle: airpulse.yaml + optional reduced-order unsteady terms
# (wake capture + clap-and-fling; gains ESTIMATED, sysid targets, A-002 relaxed).
# Generated by yaml round-trip from airpulse.yaml — comments live in the original.
aero:
  coefficients:
    cd_0:
      provenance:
        reference: Dickinson et al. 1999
        source: literature
        valid_regime: as above
      unit: '1'
      value: 1.92
    cd_freq:
      provenance:
        reference: Dickinson et al. 1999
        source: literature
      unit: '1'
      value: 2.04
    cd_phase_deg:
      provenance:
        reference: Dickinson et al. 1999
        source: literature
      unit: deg
      value: 9.82
    cd_slope:
      provenance:
        reference: Dickinson et al. 1999
        source: literature
        valid_regime: as above
      unit: '1'
      value: 1.55
    cl_0:
      provenance:
        reference: Dickinson et al. 1999
        source: literature
        valid_regime: 'Robofly Re ~ O(100); AirPulse Re ~ 3e4: extrapolation, unverified'
      unit: '1'
      value: 0.225
    cl_freq:
      provenance:
        reference: Dickinson et al. 1999
        source: literature
      unit: '1'
      value: 2.13
    cl_phase_deg:
      provenance:
        reference: Dickinson et al. 1999
        source: literature
      unit: deg
      value: 7.2
    cl_slope:
      provenance:
        reference: Dickinson et al. 1999
        source: literature
        valid_regime: as above
      unit: '1'
      value: 1.58
  name: quasi_steady_blade_element
  unsteady:
    clap_fling:
      gain: 0.5
      params:
        gap_threshold: 0.05
    wake_capture:
      gain: 0.5
      params:
        tau_decay_frac: 0.2
        tau_rise_frac: 0.05
blade_elements:
  discretization: equal_span
  n_elements: 16
bodies:
- com_offset:
    provenance:
      reference: B origin placed at the neutral-stroke CG (Table A1, flap 0)
      source: literature
      uncertainty_or_range: CG at (-10.94, -0.036, -8.469) mm in the paper's frame
        at flap 0
    unit: m
    value:
    - 0.0
    - 0.0
    - 0.0
  inertia:
    provenance:
      reference: Gu et al. 2026 (arXiv:2602.06811), Table A1, flap angle 0
      source: literature
      uncertainty_or_range: whole-robot inertia at neutral stroke; varies up to ~2.5x
        per stroke in reality
    unit: kg m^2
    value:
    - - 0.0001623
      - -5.42e-07
      - 1.1341e-06
    - - -5.42e-07
      - 5.0337e-05
      - 3.01e-06
    - - 1.1341e-06
      - 3.01e-06
      - 0.00021043
  mass:
    provenance:
      reference: Gu et al. 2026 (arXiv:2602.06811), Table A1 (flap 0 deg)
      source: literature
      uncertainty_or_range: characterized config; flight-ready 26 g
    unit: kg
    value: 0.0257
  name: body
data_status: literature_partial
joints: []
name: airpulse_m6_unsteady
wings:
- dihedral_angle:
    provenance:
      reference: arXiv:2602.06811 (fixed 50 deg V-dihedral)
      source: literature
    unit: rad
    value: 0.8727
  hinge_location:
    provenance:
      source: estimated
      uncertainty_or_range: servo/hinge location not tabulated in the paper; estimated
        near the CG-height fuselage side
    unit: m
    value:
    - 0.0
    - 0.01
    - -0.008
  name: wing_right
  pitch_axis_fraction:
    provenance:
      source: estimated
      uncertainty_or_range: leading-edge spar; AirPulse pitch is passive (no actuated
        axis)
    unit: '1'
    value: 0.0
  planform: rectangular
  root_chord:
