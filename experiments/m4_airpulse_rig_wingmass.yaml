# Post-M5 item 1: AirPulse rig run WITH wing structural mass (DR-006).
# Identical conditions to m4_airpulse_rig.yaml, but the vehicle carries
# 0.5 g/wing membrane mass (airpulse_wingmass.yaml) and the record includes
# the inertial root force channels (F_inertial / M_inertial / F_sensor) —
# what the paper's force balance would measure on top of the aerodynamic
# force if inertial forces were not subtracted.
name: m4_airpulse_rig_wingmass
kind: fixed_body
vehicle: ../reference_vehicles/airpulse_wingmass.yaml

kinematics:
  flap_amplitude: {value: 1.2217, unit: rad, provenance: {source: literature, reference: "arXiv:2602.06811 (140 deg peak-to-peak)"}}
  flap_frequency: {value: 3.25, unit: Hz, provenance: {source: literature, reference: "arXiv:2602.06811"}}
  pitch_amplitude: {value: 0.7854, unit: rad, provenance: {source: estimated, uncertainty_or_range: "passive feathering approximated by prescribed 45 deg sinusoid"}}
  pitch_phase: {value: 3.14159, unit: rad, provenance: {source: estimated, uncertainty_or_range: "180 deg phasing (frames.md conventions)"}}
  pitch_offset: {value: 0.0, unit: rad, provenance: {source: estimated, uncertainty_or_range: "placeholder"}}
  stroke_plane_angle: {value: 0.0, unit: rad, provenance: {source: estimated, uncertainty_or_range: "placeholder"}}
  stroke_phase: {value: -1.5708, unit: rad, provenance: {source: literature, reference: "arXiv:2602.06811 Eq. 16 phase origin (mid-downstroke)"}}

environment:
  air_density: {value: 1.225, unit: kg/m^3, provenance: {source: literature, reference: "arXiv:2602.06811 methods"}}
  kinematic_viscosity: {value: 1.460e-5, unit: m^2/s, provenance: {source: literature, reference: "arXiv:2602.06811 methods"}}
  wind: {value: [0.0, 0.0, 0.0], unit: m/s, provenance: {source: estimated, uncertainty_or_range: "still air rig"}}

n_wingbeats: 5
steps_per_wingbeat: 200
