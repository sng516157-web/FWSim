# X-wing reference vehicle DRAFT (DR-004): four wings, fore/aft pairs.
# Simplifications: aft pair same orientation, anti-phase stroke only;
# clap-and-fling excluded (A-002). All values source: estimated.
name: xwing_draft
data_status: pending_original_parameters
