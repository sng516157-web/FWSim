      reference: arXiv:2602.06811 mean aerodynamic chord
      source: literature
      uncertainty_or_range: rectangular approximation
    unit: m
    value: 0.183
- dihedral_angle:
    provenance:
      reference: arXiv:2602.06811 (fixed 50 deg V-dihedral)
      source: literature
    unit: rad
    value: 0.8727
  hinge_location:
